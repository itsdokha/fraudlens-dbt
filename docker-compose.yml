services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: fraudlens-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT count() FROM transactions_db.transactions'"]
      interval: 5s
      timeout: 5s
      retries: 30

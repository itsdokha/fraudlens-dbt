# Установка: make pre-commit-install (перед первым запуском нужен `make deps`:
# dbt-templater sqlfluff компилирует модели и использует пакеты из dbt/dbt_packages).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.5.0
    hooks:
      - id: sqlfluff-fix
        args: [--dialect, clickhouse]
        files: ^dbt/(models|tests)/.*\.sql$
        additional_dependencies:
          - dbt-core==1.10.23
          - dbt-clickhouse==1.10.3
          - sqlfluff-templater-dbt==3.5.0
      - id: sqlfluff-lint
        args: [--dialect, clickhouse]
        files: ^dbt/(models|tests)/.*\.sql$
        additional_dependencies:
          - dbt-core==1.10.23
          - dbt-clickhouse==1.10.3
          - sqlfluff-templater-dbt==3.5.0
